<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>大会ホーム — W杯予想メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
/* page-specific */
.next-card{position:relative;overflow:hidden;border-radius:var(--radius-lg);padding:18px 17px;
  background:linear-gradient(150deg, rgba(30,60,150,.5), rgba(13,22,52,.92));
  border:1px solid rgba(80,120,220,.3);box-shadow:0 16px 40px rgba(20,50,140,.3), inset 0 1px 0 rgba(255,255,255,.06)}
.next-card .glow{position:absolute;top:-60px;right:-50px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%, rgba(80,140,255,.6), transparent 60%);pointer-events:none}
.next-card .teams-line{display:flex;align-items:center;gap:11px;margin-top:11px}
.next-card .teams-line .jp{font-family:"Roboto Mono";font-size:10px;font-weight:700;letter-spacing:.1em;
  background:rgba(255,255,255,.1);padding:3px 7px;border-radius:6px;color:#cdd8f5}
.next-card .teams-line .vs-t{font-size:17px;font-weight:900}
.next-card .teams-line .vs-t .x{color:#8fa6e0;font-size:13px;margin:0 7px;font-weight:700}
.cd-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}
.cd-tile{background:rgba(6,10,26,.6);border:1px solid var(--line-soft);border-radius:12px;padding:11px 4px;text-align:center}
.cd-tile .n{font-family:"Roboto Mono";font-size:27px;font-weight:700;color:#fff;line-height:1}
.cd-tile .l{font-size:9.5px;letter-spacing:.14em;color:var(--muted);font-weight:700;margin-top:5px;font-family:"Roboto Mono"}
.ko-line{font-size:11px;color:var(--muted);margin-top:12px;font-weight:600;display:flex;align-items:center;gap:7px}

.today .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.today .top .l{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}
.today .top .l .i{color:#ff5a60}
.today .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:4px 0}
.today .team{display:flex;flex-direction:column;align-items:center;gap:8px}
.today .team .nm{font-size:15px;font-weight:800}
.today .vs{font-family:"Roboto Mono";font-size:13px;color:var(--faint);font-weight:700;text-align:center}
.today .vs .ko{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.today .ft{display:flex;align-items:center;justify-content:space-between;margin-top:15px;
  padding-top:13px;border-top:1px solid var(--line-soft)}
.today .ft .dl{font-size:11.5px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.today .ft .dl b{color:#ff7a7e;font-family:"Roboto Mono"}
.today .ft .rw{font-size:11.5px;font-weight:700;color:var(--gold)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="home.jsx"></script>
</body>
</html>
