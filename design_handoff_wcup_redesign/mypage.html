<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>マイページ — W杯予想メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>

.profile{display:flex;align-items:center;gap:14px}
.profile .av{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:900;color:#fff;background:linear-gradient(160deg,#ff4147,#c41420);box-shadow:0 10px 26px var(--red-glow)}
.profile .nm{font-size:20px;font-weight:900}
.profile .edit{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#ff6066;margin-top:5px;cursor:pointer}
.pred-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line-soft)}
.pred-row:last-child{border-bottom:none}
.pred-row .mid{flex:1;min-width:0}
.pred-row .mt{font-size:12px;color:var(--muted);font-weight:600}
.pred-row .pk{font-size:14px;font-weight:800;margin-top:3px;display:flex;align-items:center;gap:6px}
.pred-row .pk .ar{color:var(--gold)}
.pred-row .dt{font-size:10.5px;color:var(--dim);margin-top:3px;font-family:"Roboto Mono"}
.pred-row .st{font-family:"Roboto Mono";font-size:10px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--line-soft);padding:4px 8px;border-radius:7px;white-space:nowrap}

</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="mypage.jsx"></script>
</body>
</html>
