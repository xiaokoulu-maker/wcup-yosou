.kv{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}
.kv .k{font-family:"Roboto Mono";font-size:10px;letter-spacing:.1em;color:var(--dim);font-weight:700}
.kv .v{font-size:16px;font-weight:800;margin-top:5px}
