<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>大会ルーム — W杯予想メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06091a;
  --bg-2:#0a0f24;
  --panel:#0f1730;
  --panel-2:#121b38;
  --card:#131d3c;
  --ink-deep:#0a1024;
  --line:rgba(132,152,214,.14);
  --line-soft:rgba(132,152,214,.09);
  --txt:#f3f5fb;
  --muted:#8b93ad;
  --dim:#646d8a;
  --red:#ff3b41;
  --red-2:#d2121e;
  --red-glow:rgba(231,38,52,.5);
  --blue:#3e7bff;
  --blue-2:#1c47c8;
  --gold:#f5b431;
  --gold-2:#e09a17;
  --green:#06c755;
  --radius:18px;
  --radius-sm:13px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Noto Sans JP",system-ui,sans-serif;
  background:
    radial-gradient(900px 520px at 82% -4%, rgba(214,32,46,.30), transparent 60%),
    radial-gradient(820px 640px at -10% 8%, rgba(38,70,160,.26), transparent 55%),
    radial-gradient(700px 700px at 50% 118%, rgba(34,52,120,.22), transparent 60%),
    linear-gradient(180deg,#070b1c 0%, #06091a 40%, #05071400 100%), #05060f;
  color:var(--txt);
  min-height:100%;
  display:flex;justify-content:center;
  letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;
}
/* phone column */
#app{width:100%;max-width:438px;min-height:100vh;position:relative;
  background:
    radial-gradient(640px 420px at 88% 2%, rgba(220,30,46,.20), transparent 58%),
    linear-gradient(180deg,#0a1026 0%, #080c1e 22%, #070a18 100%);
  border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft);
  box-shadow:0 0 90px rgba(0,0,0,.5);
  padding-bottom:40px;overflow:hidden;
}
.wrap{padding:0 18px}

/* ---- top bar ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;
  padding:13px 18px 11px;font-size:11px;letter-spacing:.12em;font-weight:700}
.topbar .brand{color:#aeb6cf;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.topbar .brand b{color:#fff}
.topbar .pill-x{color:#cdd3e6;background:rgba(255,255,255,.05);border:1px solid var(--line);
  padding:5px 10px;border-radius:999px;font-size:10px;white-space:nowrap;letter-spacing:.06em}
.backrow{display:flex;align-items:center;gap:4px;color:#aab2cc;font-weight:700;font-size:13px;
  padding:6px 18px 4px;cursor:pointer;width:max-content}
.backrow:hover{color:#fff}

/* ---- eyebrow + section heads ---- */
.eyebrow{display:flex;align-items:center;gap:10px;font-family:"Roboto Mono",monospace;
  font-size:11px;letter-spacing:.34em;font-weight:600;color:#ff5a60;text-transform:uppercase}
.eyebrow::before{content:"";width:26px;height:2px;background:linear-gradient(90deg,#ff5a60,transparent);border-radius:2px}
.sechead{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.sechead h2{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;letter-spacing:.02em}
.sechead h2::before{content:"";width:4px;height:17px;border-radius:3px;
  background:linear-gradient(180deg,#ff4147,#c41420)}
.sechead .act{font-size:11.5px;color:var(--dim);font-weight:600;display:flex;align-items:center;gap:3px;cursor:pointer}
.sechead .act:hover{color:var(--muted)}

/* ---- hero ---- */
.hero{position:relative;padding:14px 18px 8px;overflow:hidden}
.hero .orb{position:absolute;top:-72px;right:-66px;width:210px;height:210px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #ff5258 0%, #d81626 42%, #7d0c16 100%);
  filter:blur(.5px);opacity:.92;box-shadow:0 24px 80px rgba(214,20,38,.5);pointer-events:none}
.hero .orb::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 70% 78%, rgba(0,0,0,.35), transparent 50%)}
.hero-card{position:relative;margin-top:14px;background:
    linear-gradient(180deg, rgba(22,30,60,.92), rgba(13,19,40,.92));
  border:1px solid var(--line);border-radius:22px;padding:20px 18px 18px;
  box-shadow:0 18px 50px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.04)}
.t-avatar{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;
  font-size:30px;font-weight:900;color:#fff;
  background:linear-gradient(160deg,#ff4147,#c41420);
  box-shadow:0 12px 30px var(--red-glow), inset 0 1px 0 rgba(255,255,255,.25);
  position:relative}
.t-avatar .ring{position:absolute;inset:-5px;border-radius:22px;border:1.5px solid rgba(255,90,96,.35)}
.hero-top{display:flex;align-items:center;gap:14px}
.hero-top .meta{flex:1;min-width:0}
.hero-title{font-size:26px;font-weight:900;line-height:1.05;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.plan-badge{display:inline-flex;align-items:center;gap:6px;margin-top:7px;
  background:rgba(245,180,49,.12);border:1px solid rgba(245,180,49,.32);color:var(--gold);
  font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}
.plan-badge .dot{width:5px;height:5px;border-radius:50%;background:var(--gold)}
.plan-badge{white-space:nowrap}

/* member status */
.members{margin-top:18px;background:var(--ink-deep);border:1px solid var(--line-soft);
  border-radius:15px;padding:14px 15px}
.members-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.avatars{display:flex;align-items:center}
.avatars .av{width:30px;height:30px;border-radius:50%;border:2px solid #0a1024;
  margin-left:-9px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.avatars .av:first-child{margin-left:0}
.avatars .av.empty{background:rgba(255,255,255,.05);border:2px dashed rgba(255,255,255,.16);color:#5a627c}
.count{font-weight:800;font-size:14px}
.count b{font-size:21px;color:#fff}
.count span{color:var(--muted);font-size:12.5px;font-weight:600}
.pbar{height:8px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;
  background:linear-gradient(90deg,#f5b431,#ff8a2a);box-shadow:0 0 16px rgba(245,180,49,.5)}
.live{display:flex;align-items:center;gap:7px;margin-top:11px;font-size:11.5px;font-weight:700;color:#37d67a}
.live .blip{width:7px;height:7px;border-radius:50%;background:#37d67a;box-shadow:0 0 0 0 rgba(55,214,122,.6);
  animation:blip 1.8s infinite}
@keyframes blip{0%{box-shadow:0 0 0 0 rgba(55,214,122,.55)}70%{box-shadow:0 0 0 7px rgba(55,214,122,0)}100%{box-shadow:0 0 0 0 rgba(55,214,122,0)}}

/* ---- generic card ---- */
.card{background:linear-gradient(180deg,rgba(19,28,58,.85),rgba(13,19,40,.85));
  border:1px solid var(--line);border-radius:var(--radius);padding:16px 15px;
  box-shadow:0 12px 34px rgba(0,0,0,.32)}
.section{margin-top:18px}

/* invite */
.invite .row{display:flex;gap:8px}
.urlfield{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:#0a1024;
  border:1px solid var(--line-soft);border-radius:11px;padding:0 12px;height:46px;color:#aeb6cf;
  font-family:"Roboto Mono",monospace;font-size:12px;overflow:hidden;white-space:nowrap}
.urlfield .u{overflow:hidden;text-overflow:ellipsis}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:800;color:#fff;
  border-radius:12px;display:flex;align-items:center;justify-content:center;gap:9px;transition:.14s;
  letter-spacing:.02em}
.btn:active{transform:translateY(1px) scale(.992)}
.btn-gold{background:linear-gradient(180deg,#f7c049,#e0990f);color:#3a2606;height:46px;padding:0 18px;
  font-size:13.5px;box-shadow:0 7px 18px rgba(225,154,23,.32)}
.btn-line{width:100%;height:50px;margin-top:10px;background:linear-gradient(180deg,#0ad15e,#03b14a);
  font-size:14.5px;box-shadow:0 9px 22px rgba(6,199,85,.3);white-space:nowrap}
.btn-line .lk{display:grid;place-items:center;width:21px;height:21px;border-radius:6px;background:rgba(255,255,255,.9);
  color:#03b14a;font-weight:900;font-size:11px;font-family:"Roboto Mono"}
.codepill{margin:11px auto 0;width:max-content;display:flex;align-items:center;gap:11px;
  background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 16px;cursor:pointer}
.codepill .lbl{font-size:10.5px;letter-spacing:.18em;color:var(--dim);font-weight:700;font-family:"Roboto Mono"}
.codepill .code{font-family:"Roboto Mono";font-weight:700;font-size:15px;letter-spacing:.18em;color:#fff}
.codepill .ic{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.06);color:#aeb6cf}
.codepill:hover .ic{color:#fff;background:rgba(255,255,255,.1)}

/* primary CTAs */
.cta{width:100%;height:58px;font-size:16px;border-radius:15px;margin-top:11px;position:relative;overflow:hidden}
.cta-red{background:linear-gradient(180deg,#ff4248 0%,#d2121e 100%);
  box-shadow:0 14px 30px var(--red-glow), inset 0 1px 0 rgba(255,255,255,.22)}
.cta-red.ghost{background:linear-gradient(180deg,rgba(255,66,72,.16),rgba(210,18,30,.12));
  border:1.5px solid rgba(255,80,86,.4);box-shadow:none;color:#ff6066}
.cta .livetag{position:absolute;top:9px;right:11px;font-family:"Roboto Mono";font-size:9.5px;font-weight:700;
  letter-spacing:.14em;color:#fff;background:rgba(0,0,0,.28);padding:3px 7px;border-radius:6px;display:flex;align-items:center;gap:5px}
.cta .livetag .b{width:6px;height:6px;border-radius:50%;background:#fff;animation:blip2 1.4s infinite}
@keyframes blip2{0%,100%{opacity:1}50%{opacity:.35}}

/* menu list */
.menu{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:13px;background:linear-gradient(180deg,rgba(19,28,58,.7),rgba(13,19,40,.7));
  border:1px solid var(--line-soft);border-radius:14px;padding:13px 14px;cursor:pointer;transition:.14s}
.mrow:hover{border-color:var(--line);background:linear-gradient(180deg,rgba(25,36,72,.85),rgba(16,23,48,.85));transform:translateX(2px)}
.mrow .ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:rgba(255,255,255,.04);border:1px solid var(--line-soft);color:#aeb6cf}
.mrow .tx{flex:1;min-width:0}
.mrow .tx .t{font-size:14px;font-weight:700;color:#eef1f9}
.mrow .tx .s{font-size:11px;color:var(--dim);margin-top:2px;font-weight:500}
.mrow .chev{color:#4d5778;flex:none}
.mrow.active{background:linear-gradient(180deg,rgba(245,140,40,.12),rgba(200,70,20,.07));
  border-color:rgba(245,150,50,.45);box-shadow:0 0 0 1px rgba(245,150,50,.12), 0 8px 22px rgba(200,80,20,.16)}
.mrow.active .ico{background:rgba(245,150,50,.16);border-color:rgba(245,150,50,.4);color:#ffb056}
.mrow.active .tx .t{color:#ffd9a8}
.mrow.accent .ico{color:#7ea2ff;background:rgba(62,123,255,.12);border-color:rgba(62,123,255,.28)}

/* admin / upgrade */
.admin{display:flex;align-items:center;gap:12px;border:1.5px dashed rgba(132,152,214,.26);
  background:rgba(255,255,255,.015);border-radius:14px;padding:13px 14px;cursor:pointer;transition:.14s}
.admin:hover{border-color:rgba(132,152,214,.42)}
.admin .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;color:#8b93ad;background:rgba(255,255,255,.03)}
.admin .tx{flex:1}
.admin .tx .t{font-size:13px;font-weight:700;color:#c8cee0}
.admin .tx .s{font-size:11px;color:var(--dim);margin-top:1px}
.upgrade{margin-top:8px;display:flex;align-items:center;gap:11px;border-radius:14px;padding:13px 15px;cursor:pointer;
  background:linear-gradient(100deg,rgba(62,123,255,.14),rgba(120,70,255,.1));border:1px solid rgba(90,130,255,.26)}
.upgrade:hover{border-color:rgba(120,150,255,.45)}
.upgrade .ico{color:var(--gold)}
.upgrade .tx{flex:1;font-size:12.5px;font-weight:700;color:#cfd6ee}
.upgrade .tx b{color:#fff}
.upgrade .go{color:#9fb4f0}

/* chat */
.chat-head{display:flex;align-items:center;justify-content:space-between}
.chat-head .l{display:flex;align-items:center;gap:9px}
.chat-head .l h2{font-size:15px;font-weight:800}
.online{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#37d67a;margin-top:3px}
.online .blip{width:6px;height:6px;border-radius:50%;background:#37d67a}
.chat-gear{color:var(--dim);cursor:pointer}.chat-gear:hover{color:#fff}
.chat-body{margin:14px 0;min-height:130px;display:flex;flex-direction:column;gap:9px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:18px 0}
.empty .bub{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#5a6488;
  background:rgba(255,255,255,.04);border:1px solid var(--line-soft)}
.empty .t{font-size:13px;font-weight:700;color:#aeb6cf}
.empty .s{font-size:11.5px;color:var(--dim);line-height:1.5;max-width:240px}
.msg{display:flex;gap:9px;align-items:flex-end;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg .av{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;
  background:linear-gradient(160deg,#ff4147,#c41420)}
.msg .bbl{background:#16203f;border:1px solid var(--line-soft);border-radius:13px;border-bottom-left-radius:5px;
  padding:8px 12px;font-size:13px;color:#e6eaf5;max-width:74%}
.msg .nm{font-size:10px;color:var(--dim);margin:0 0 3px 2px;font-weight:700}
.composer{display:flex;gap:8px;align-items:center}
.composer input{flex:1;height:46px;border-radius:12px;background:#0a1024;border:1px solid var(--line-soft);
  color:#fff;padding:0 14px;font-family:inherit;font-size:13.5px;outline:none}
.composer input::placeholder{color:#525c7c}
.composer input:focus{border-color:rgba(132,152,214,.32)}
.sendbtn{width:46px;height:46px;border-radius:12px;flex:none;background:linear-gradient(180deg,#ff4248,#d2121e);
  box-shadow:0 8px 18px var(--red-glow)}

/* promo rows */
.promo{margin-top:10px;display:flex;align-items:center;gap:12px;border-radius:14px;padding:12px 14px;cursor:pointer;
  background:linear-gradient(100deg,rgba(245,180,49,.1),rgba(180,120,20,.05));border:1px solid rgba(245,180,49,.22)}
.promo:hover{border-color:rgba(245,180,49,.4)}
.promo .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;color:#f5b431;
  background:rgba(245,180,49,.12);border:1px solid rgba(245,180,49,.26)}
.promo .tx{flex:1}.promo .tx .t{font-size:13px;font-weight:700;color:#f4e6c8}
.promo .tx .s{font-size:10.5px;color:#9a8f72;margin-top:1px}
.promo .price{font-family:"Roboto Mono";font-weight:700;font-size:13px;color:#3a2606;background:linear-gradient(180deg,#f7c049,#e0990f);
  padding:6px 11px;border-radius:9px}
.pr-row{margin-top:8px;display:flex;align-items:center;gap:11px;border-radius:13px;padding:11px 13px;cursor:pointer;
  background:rgba(255,255,255,.02);border:1px solid var(--line-soft)}
.pr-row:hover{border-color:var(--line)}
.pr-row .tag{font-family:"Roboto Mono";font-size:9px;font-weight:700;letter-spacing:.1em;color:#7ea2ff;
  background:rgba(62,123,255,.14);border:1px solid rgba(62,123,255,.3);padding:3px 6px;border-radius:6px}
.pr-row .tx{flex:1;font-size:12.5px;font-weight:700;color:#c8cee0}
.pr-row .go{font-size:11px;color:var(--dim);font-weight:600;display:flex;align-items:center;gap:3px}

.foot{text-align:center;font-size:11px;color:var(--dim);margin-top:22px;font-weight:600}
.foot b{color:#ff5a60}

/* density */
#app.compact .section{margin-top:13px}
#app.compact .menu{gap:6px}
#app.compact .mrow{padding:11px 13px}
#app.comfy .section{margin-top:24px}
#app.comfy .menu{gap:10px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:#1b264a;border:1px solid var(--line);color:#fff;font-size:13px;font-weight:700;
  padding:11px 20px;border-radius:999px;box-shadow:0 14px 34px rgba(0,0,0,.5);transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .ok{color:#37d67a}
</style>
</head>

<div id="root"></div>
