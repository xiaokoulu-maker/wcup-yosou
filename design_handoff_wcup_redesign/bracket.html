<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>トーナメント表 — W杯予想メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>

.note-card{background:rgba(62,123,255,.07);border:1px solid rgba(62,123,255,.2);border-radius:13px;padding:11px 14px;font-size:11px;color:#9fb4d8;font-weight:500;line-height:1.6}
.bracket-scroll{overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.bracket{display:flex;gap:16px;min-width:max-content;padding:2px}
.round{display:flex;flex-direction:column;gap:10px;min-width:128px}
.round .rt{font-family:"Roboto Mono";font-size:10px;letter-spacing:.12em;color:var(--gold);font-weight:700;text-align:center;margin-bottom:2px}
.slot{background:linear-gradient(180deg,rgba(19,28,58,.7),rgba(13,19,40,.7));border:1px solid var(--line-soft);border-radius:11px;padding:8px 10px;display:flex;flex-direction:column;gap:7px;justify-content:center}
.slot .tm{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--muted)}
.slot .tm .dotf{width:18px;height:13px;border-radius:3px;background:rgba(255,255,255,.07);border:1px dashed var(--line)}
.slot.filled .tm{color:#eef1f9}
.slot .vs-s{font-family:"Roboto Mono";font-size:8.5px;color:var(--faint);text-align:center}

</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="bracket.jsx"></script>
</body>
</html>
