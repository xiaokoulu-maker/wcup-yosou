const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON);

function dbToApp(d) {
  return {
    id: d.id, name: d.name, creatorName: d.creator_name,
    maxParticipants: d.max_participants, adminPasscode: d.admin_passcode,
    participants: d.participants || [], results: d.results || null,
    plan: d.plan || "free", createdAt: d.created_at,
  };
}

async function loadT(id) {
  try {
    const { data, error } = await db.from("tournaments").select("*").eq("id", id).single();
    if (error || !data) return null;
    return dbToApp(data);
  } catch(e) { console.error(e); return null; }
}

async function saveT(t) {
  try {
    const row = {
      id: t.id, name: t.name, creator_name: t.creatorName,
      max_participants: t.maxParticipants, admin_passcode: t.adminPasscode,
      participants: t.participants, results: t.results, plan: t.plan || "free",
    };
    await db.from("tournaments").upsert(row, { onConflict: "id" });
  } catch(e) { console.error(e); }
}

// Supabase Realtimeサブスクリプション
function subscribeToTournament(id, onUpdate) {
  const channel = db.channel("t-" + id)
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "tournaments", filter: `id=eq.${id}` },
      payload => { if (payload.new) onUpdate(dbToApp(payload.new)); })
    .subscribe();
  return () => db.removeChannel(channel);
}

// ESPN API: 試合データ取得
async function fetchMatches(dateStr) {
  try {
    const url = `https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=${dateStr}&limit=50`;
    const res = await fetch(url);
    const data = await res.json();
    return data.events || [];
  } catch(e) { return []; }
}

async function fetchMatchRange() {
  // 開幕から1週間分まとめて取得
  const dates = [];
  const start = new Date("2026-06-11");
  for (let i = 0; i < 14; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    dates.push(d.toISOString().slice(0,10).replace(/-/g,""));
  }
  const all = await Promise.all(dates.map(d => fetchMatches(d)));
  return all.flat();
}
</script>

function calcPts(pred, res) {
  if (!pred || !res?.winner) return 0;
  let p = 0;
  if (pred.winner === res.winner) p += 20;
  if (pred.runnerUp === res.runnerUp) p += 15;
  if (pred.topScorer && res.topScorer && pred.topScorer.trim() === res.topScorer.trim()) p += 15;

/* ── Join ── */
function PgJoin({tourn:t, nav, update, setMyId}) {
  const [nick, setNick] = useState("");
  const [icon, setIcon] = useState("⚽");
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);

  const join = async () => {
    if (!nick.trim()) { setErr("ニックネームを入力してください"); return; }
    const fresh = await loadT(t.id);
    const cur = fresh || t;
    if (cur.participants.length >= cur.maxParticipants) { setErr("参加上限に達しています"); return; }
    setLoading(true);
    const p = { id:genId(), nickname:nick.trim(), icon, predictions:null, points:0 };
    const updated = { ...cur, participants:[...cur.participants, p] };
    await update(updated);
    setMyId(p.id);
    nav("predict");
    setLoading(false);
  };

  return (
    <div style={{padding:"20px 18px 40px"}}>
      <Back onClick={()=>nav("tournament")} />
      <div style={{color:G.gold,fontSize:21,fontWeight:900,marginBottom:4}}>参加する</div>
      <div style={{color:G.muted,fontSize:13,marginBottom:20}}>{t.name}</div>
      <div style={crd}>
        <FInput label="ニックネーム ＊" placeholder="例: サッカー太郎" value={nick} onChange={setNick} />
        <div>
          <label style={lbl}>アイコンを選ぶ</label>
          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8,marginTop:6}}>
            {ICONS.map(ic=><button key={ic} onClick={()=>setIcon(ic)} style={{fontSize:26,background:icon===ic?`${G.gold}22`:"transparent",border:`2px solid ${icon===ic?G.gold:"transparent"}`,borderRadius:12,padding:"8px 0",cursor:"pointer"}}>{ic}</button>)}
          </div>
        </div>
        <div style={{marginTop:16,background:G.dark,borderRadius:12,padding:16,textAlign:"center"}}>
          <div style={{fontSize:36}}>{icon}</div>
          <div style={{color:"#fff",fontSize:14,fontWeight:700,marginTop:6}}>{nick||"（名前未入力）"}</div>
        </div>
      </div>
      <Err msg={err} />
      <button style={btnG} onClick={join} disabled={loading}>{loading?"参加中...":"参加して予想を入力する →"}</button>
    </div>
  );
}

/* ── Predict ── */
function PgPredict({tourn:t, nav, update, myId}) {
  const [pred, setPred] = useState({winner:"",runnerUp:"",topScorer:"",japanResult:"",favoriteCountry:"",comment:""});
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);
  const set = k => v => setPred(p=>({...p,[k]:v}));

  const save = async () => {
    if (!pred.winner||!pred.runnerUp||!pred.japanResult||!pred.favoriteCountry) { setErr("＊の項目を選択してください"); return; }
    setLoading(true);
    const fresh = await loadT(t.id);
    const cur = fresh || t;
    const updated = { ...cur, participants:cur.participants.map(p=>p.id===myId?{...p,predictions:pred,points:cur.results?calcPts(pred,cur.results):0}:p) };
    await update(updated);
    nav("predictions");
    setLoading(false);
  };

  return (
    <div style={{padding:"20px 18px 40px"}}>
      <Back onClick={()=>nav("tournament")} />
      <div style={{color:G.gold,fontSize:21,fontWeight:900,marginBottom:4}}>予想を入力する</div>
      <div style={{color:G.muted,fontSize:13,marginBottom:16}}>あなたの予想を教えてください！</div>
      <div style={crd}>
        <div style={{marginBottom:18}}><label style={lbl}>🥇 優勝国 ＊</label><Chips opts={COUNTRIES} value={pred.winner} onChange={set("winner")} /></div>
        <div style={{marginBottom:18}}><label style={lbl}>🥈 準優勝国 ＊</label><Chips opts={COUNTRIES} value={pred.runnerUp} onChange={set("runnerUp")} /></div>
        <div style={{marginBottom:18}}><label style={lbl}>⚽ 得点王（名前を入力）</label><input style={inp} placeholder="例: エムバペ" value={pred.topScorer} onChange={e=>set("topScorer")(e.target.value)} /></div>
        <div style={{marginBottom:18}}><label style={lbl}>🇯🇵 日本代表の成績 ＊</label><Chips opts={JAPAN_RES} value={pred.japanResult} onChange={set("japanResult")} /></div>
        <div style={{marginBottom:18}}><label style={lbl}>❤️ 一番応援している国 ＊</label><Chips opts={COUNTRIES} value={pred.favoriteCountry} onChange={set("favoriteCountry")} /></div>
        <div><label style={lbl}>💬 一言コメント</label><textarea style={{...inp,height:72,resize:"none"}} placeholder="予想の根拠や意気込みを！" value={pred.comment} onChange={e=>set("comment")(e.target.value)} /></div>
      </div>
      <Err msg={err} />
      <button style={btnG} onClick={save} disabled={loading}>{loading?"保存中...":"💾 予想を保存する"}</button>
    </div>
  );
}

/* ── Predictions ── */

  useEffect(() => {
    if (!t?.id) return;
    const unsub = subscribeToTournament(t.id, setTourn);

  }, [t?.id]);

  const winCount = {};
  t.participants.forEach(p=>{ if(p.predictions?.winner) winCount[p.predictions.winner]=(winCount[p.predictions.winner]||0)+1; });
  const winRank = Object.entries(winCount).sort((a,b)=>b[1]-a[1]);

  return (
    <div style={{padding:"20px 18px 40px"}}>
      <Back onClick={()=>nav("tournament")} />

      </div>
      {winRank.length > 0 && (
        <div style={{...crd,border:`1px solid ${G.gold}44`}}>
          <div style={{color:G.gold,fontWeight:700,fontSize:13,marginBottom:10}}>🥇 優勝国予想の集計</div>

            <div key={c} onClick={()=>goCountry(c)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6,cursor:"pointer"}}>

              <div><span style={{color:G.gold,fontWeight:700,fontSize:15}}>{n}</span><span style={{color:G.muted,fontSize:12}}>人</span></div>

            </div>

              <>

                  <div onClick={()=>goCountry(p.predictions.winner)} style={{cursor:"pointer"}}><Badge label="優勝" val={p.predictions.winner} /></div>

/* ── Ranking ── */
function PgRanking({tourn:t, setTourn, nav}) {
  useEffect(() => {

        <div style={{color:G.muted,fontSize:12,marginTop:4}}>{t.name}</div>
        <div style={{color:G.muted,fontSize:11,marginTop:6}}>🔄 リアルタイム自動更新中</div>

        {hasRes&&(
          <div style={{...crd,border:`1px solid ${G.gold}66`,marginBottom:14}}>
            <div style={{color:G.gold,fontWeight:700,fontSize:13,marginBottom:10}}>📊 確定結果</div>

                  <div style={{flex:1}}><div style={{color:"#fff",fontWeight:700,fontSize:14}}>{p.nickname}</div><div style={{color:G.muted,fontSize:11,marginTop:3}}>{rankMsg(rank,ranked.length)}</div></div>
                  <div style={{textAlign:"right"}}><div style={{color:G.gold,fontWeight:900,fontSize:22}}>{p.pts}</div><div style={{color:G.muted,fontSize:11}}>pt</div></div>

        <div style={{background:G.card,borderRadius:12,padding:"12px 16px",marginTop:8}}>

          ))}

        <div style={{marginTop:12}}><button style={btnO} onClick={()=>nav("tournament")}>← 大会ページへ戻る</button></div>
      </div>
    </div>
  );
}

/* ── Admin ── */
function PgAdmin({tourn:t, nav, update, adminOk, setAdminOk}) {
  const [pass, setPass] = useState("");
  const [passErr, setPassErr] = useState("");
  const [res, setRes] = useState(t.results||{winner:"",runnerUp:"",topScorer:"",japanResult:""});
  const [err, setErr] = useState("");
  const [saved, setSaved] = useState(false);
  const [loading, setLoading] = useState(false);
  const setR = k => v => setRes(r=>({...r,[k]:v}));
  const checkPass = () => { if(pass===t.adminPasscode){setAdminOk(true);setPassErr("");}else setPassErr("パスコードが違います"); };
  const save = async () => {
    if(!res.winner||!res.runnerUp||!res.japanResult){setErr("優勝国・準優勝国・日本代表成績は必須です");return;}
    setLoading(true);
    const fresh=await loadT(t.id); const cur=fresh||t;
    const updated={...cur,results:res,participants:cur.participants.map(p=>({...p,points:p.predictions?calcPts(p.predictions,res):0}))};
    await update(updated); setSaved(true); setLoading(false);
    setTimeout(()=>{setSaved(false);nav("ranking");},1800);
  };
  if(!adminOk)return(
    <div style={{padding:"20px 18px 40px"}}>
      <Back onClick={()=>nav("tournament")}/>
      <div style={{color:G.gold,fontSize:21,fontWeight:900,marginBottom:4}}>🔐 管理者ページ</div>
      <div style={{color:G.muted,fontSize:13,marginBottom:20}}>管理用パスコードを入力してください</div>
      <div style={crd}><FInput label="パスコード" placeholder="パスコードを入力" type="password" value={pass} onChange={setPass}/><Err msg={passErr}/><button style={btnG} onClick={checkPass}>認証する</button></div>
    </div>
  );
  return(
    <div style={{padding:"20px 18px 40px"}}>
      <Back onClick={()=>nav("tournament")}/>
      <div style={{color:G.gold,fontSize:21,fontWeight:900,marginBottom:4}}>結果を入力する</div>
      <div style={crd}>
        <div style={{marginBottom:18}}><label style={lbl}>🥇 優勝国 ＊</label><Chips opts={COUNTRIES} value={res.winner} onChange={setR("winner")}/></div>
        <div style={{marginBottom:18}}><label style={lbl}>🥈 準優勝国 ＊</label><Chips opts={COUNTRIES} value={res.runnerUp} onChange={setR("runnerUp")}/></div>
        <div style={{marginBottom:18}}><label style={lbl}>⚽ 得点王</label><input style={inp} placeholder="得点王の名前" value={res.topScorer} onChange={e=>setR("topScorer")(e.target.value)}/></div>
        <div><label style={lbl}>🇯🇵 日本代表の成績 ＊</label><Chips opts={JAPAN_RES} value={res.japanResult} onChange={setR("japanResult")}/></div>
      </div>
      <Err msg={err}/>
      {saved?<div style={{background:"#1a4730",border:`1px solid ${G.gold}`,borderRadius:14,padding:16,textAlign:"center",color:"#fff",fontWeight:700}}>✅ 保存完了！ランキングに移動します...</div>
            :<button style={btnG} onClick={save} disabled={loading}>{loading?"保存中...":"💾 結果を保存してランキング更新"}</button>}
    </div>
  );
}

/* ── Upgrade ── */
function PgUpgrade({nav, tourn:t, update}) {
  const [unlockCode, setUnlockCode] = useState("");
  const [unlockErr, setUnlockErr] = useState("");
  const [unlocked, setUnlocked] = useState(false);

  const tryUnlock = async () => {
    const code = unlockCode.trim().toUpperCase();
    let planKey = null;
    if (code.includes("STANDARD")) planKey = "standard";
    else if (code.includes("PREMIUM")) planKey = "premium";
    else if (code.includes("GROUP")) planKey = "group";
    if (!planKey || !t) { setUnlockErr("コードが正しくありません。"); return; }
    const plan = STRIPE[planKey];
    const updated = { ...t, plan: planKey, maxParticipants: plan.people };
    await update(updated);
    setUnlocked(true);
    setTimeout(() => nav("tournament"), 1500);
  };

  return (
    <div style={{padding:"20px 18px 40px"}}>
      <Back onClick={()=>nav(t?"tournament":"home")}/>
      <div style={{textAlign:"center",marginBottom:24}}>
        <div style={{fontSize:40,marginBottom:8}}>🏆</div>
        <div style={{color:G.gold,fontSize:22,fontWeight:900,marginBottom:6}}>プランをアップグレード</div>
        <div style={{color:G.muted,fontSize:13,lineHeight:1.7}}>有料プランで参加人数の拡大・<br/>参加人数の拡大ができます</div>
      </div>
      <div style={{background:"#0e2a1a",border:"1px solid #2a5a3a",borderRadius:12,padding:"12px 16px",marginBottom:14}}>
        <div style={{color:G.muted,fontSize:12,fontWeight:700,marginBottom:4}}>現在：無料プラン</div>
        <div style={{color:"#8ba",fontSize:12}}>大会1個まで ／ 参加5人まで ／ AI予想なし</div>
      </div>
      {Object.entries(STRIPE).map(([key,plan])=>(
        <div key={key} style={{...crd,border:key==="premium"?`2px solid ${G.gold}88`:"2px solid transparent",marginBottom:10,position:"relative"}}>
          {key==="premium"&&<div style={{position:"absolute",top:-10,left:20,background:G.gold,color:"#111",fontSize:10,fontWeight:700,padding:"2px 10px",borderRadius:20}}>人気No.1</div>}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div><div style={{color:"#fff",fontWeight:700,fontSize:16}}>{plan.label}プラン</div><div style={{color:G.muted,fontSize:12,marginTop:2}}>{plan.people}人まで参加可能</div></div>
            <div style={{textAlign:"right"}}><div style={{color:G.gold,fontWeight:900,fontSize:22}}>¥{plan.price.toLocaleString()}</div><div style={{color:G.muted,fontSize:11}}>買い切り</div></div>
          </div>
          <div style={{fontSize:12,color:"#8ba",marginBottom:12}}>✅ {plan.people}人まで　✅ 人数拡大　✅ リアルタイム更新</div>
          <button onClick={()=>window.open(t?`${plan.url}?client_reference_id=${t.id}`:plan.url,"_blank")} style={{...btnG,fontSize:14,padding:"12px"}}>このプランで決済する →</button>
        </div>
      ))}
      <div style={{...crd,marginTop:8}}>
        <div style={{color:G.gold,fontWeight:700,fontSize:13,marginBottom:8}}>💳 支払い完了後のアンロック</div>
        <div style={{color:G.muted,fontSize:12,marginBottom:12,lineHeight:1.7}}>支払い完了後、メールに記載のアンロックコードを入力してください。</div>
        <div style={{display:"flex",gap:8}}>
          <input style={{...inp,flex:1}} placeholder="アンロックコードを入力" value={unlockCode} onChange={e=>setUnlockCode(e.target.value)}/>
          <button onClick={tryUnlock} style={{background:G.gold,color:"#111",border:"none",borderRadius:10,padding:"0 14px",fontWeight:700,cursor:"pointer",flexShrink:0}}>認証</button>
        </div>
        {unlockErr&&<div style={{marginTop:8}}><Err msg={unlockErr}/></div>}
        {unlocked&&<div style={{marginTop:8,color:"#4caf50",fontSize:13,fontWeight:700}}>✅ アンロック完了！</div>}
      </div>
    </div>
  );
}

            style={{...crd,border:i===0?`1.5px solid ${G.gold}66`:"1.5px solid transparent",cursor:"pointer"}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{minWidth:36,textAlign:"center"}}>
                {i<3?<div style={{fontSize:24}}>{"🥇🥈🥉"[i]}</div>:<div style={{color:"#666",fontWeight:900,fontSize:15}}>{i+1}</div>}
              </div>
              <FlagImg country={p.country} size={34}/>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                  <span style={{color:"#fff",fontWeight:700,fontSize:14}}>{p.country}</span>
                  <span style={{color:p.trend==="↑"?"#4caf50":p.trend==="↓"?"#f44":"#888",fontSize:13,fontWeight:700}}>{p.trend}</span>
                </div>
                <div style={{background:"#0a1f0f",borderRadius:6,height:7,overflow:"hidden",marginBottom:4}}>
                  <div style={{background:i===0?G.gold:i<3?"#4caf50":G.green,width:`${Math.min(p.pct*4.5,100)}%`,height:"100%",borderRadius:6}}/>
                </div>
                <div style={{color:G.muted,fontSize:11,lineHeight:1.4}}>{p.reason}</div>
              </div>
              <div style={{textAlign:"right",minWidth:42}}>
                <div style={{color:i===0?G.gold:"#fff",fontWeight:900,fontSize:18}}>{p.pct}%</div>
              </div>
            </div>
          </div>
        ))}
        <div style={{background:G.dark,borderRadius:10,padding:"12px 14px"}}>
          <div style={{color:G.muted,fontSize:11,lineHeight:1.8}}>
            ※ これは予想大会を盛り上げるための表示用サンプルです。賭け・オッズ・払戻などの情報ではありません。<br/>
            ※ 各国をタップすると試合情報が見られます。
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── 試合日程 ── */
function PgSchedule({nav, goCountry}) {
  const [matches, setMatches] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState("all");

  useEffect(() => {
    setLoading(true);
    fetchMatchRange().then(data => {
      setMatches(data);
      setLoading(false);
    });
  }, []);

  const filtered = matches.filter(m => {
    const status = m.status?.type?.state;
    if (filter === "live") return status === "in";
    if (filter === "done") return status === "post";
    if (filter === "upcoming") return status === "pre";
    return true;
  });

  const grouped = {};
  filtered.forEach(m => {
    const date = new Date(m.date).toLocaleDateString("ja-JP",{month:"numeric",day:"numeric",weekday:"short"});
    if (!grouped[date]) grouped[date] = [];
    grouped[date].push(m);
  });

  return (
    <div style={{paddingBottom:40}}>
      <div style={{background:"linear-gradient(180deg,#0e3020,#08180e)",padding:"36px 20px 22px",textAlign:"center"}}>
        <Back onClick={()=>nav("home")}/>
        <div style={{color:G.gold,fontSize:22,fontWeight:900}}>📅 試合日程・結果</div>
        <div style={{color:G.muted,fontSize:12,marginTop:4}}>FIFA ワールドカップ 2026</div>
      </div>
      <div style={{padding:"14px 18px 0"}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:14}}>
          {[["all","すべて"],["live","試合中"],["upcoming","予定"],["done","結果"]].map(([v,lb])=>(
            <button key={v} onClick={()=>setFilter(v)} style={{background:filter===v?G.gold:G.card,color:filter===v?"#111":"#ccc",border:"none",borderRadius:10,padding:"8px 4px",fontSize:12,cursor:"pointer",fontWeight:filter===v?700:400}}>
              {lb}
            </button>
          ))}
        </div>
        {loading ? <div style={{color:G.muted,textAlign:"center",padding:"40px 0"}}>⚽ 試合データ取得中...</div>
          : Object.keys(grouped).length === 0
            ? <div style={{background:G.card,borderRadius:14,padding:24,textAlign:"center"}}><div style={{fontSize:36,marginBottom:12}}>📅</div><div style={{color:"#fff",fontWeight:700,marginBottom:8}}>W杯開幕まで もうすぐ！</div><div style={{color:G.muted,fontSize:13,lineHeight:1.8}}>2026年6月11日（木）開幕<br/>グループステージ〜決勝（7月19日）<br/>全48チームが参加する史上最大のW杯</div></div>
            : Object.entries(grouped).map(([date, ms])=>(
              <div key={date}>
                <div style={{color:G.muted,fontSize:12,fontWeight:700,padding:"10px 4px 6px",letterSpacing:1}}>{date}</div>
                {ms.map(m=>{
                  const comps = m.competitions?.[0]?.competitors || [];
                  const home = comps.find(c=>c.homeAway==="home") || comps[0];
                  const away = comps.find(c=>c.homeAway==="away") || comps[1];
                  const status = m.status?.type?.state;
                  const isLive = status === "in";
                  const isDone = status === "post";
                  const homeJp = ESPN_TO_JP[home?.team?.displayName] || home?.team?.displayName;
                  const awayJp = ESPN_TO_JP[away?.team?.displayName] || away?.team?.displayName;
                  const time = new Date(m.date).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
                  return (
                    <div key={m.id} style={{...crd,marginBottom:8}}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <div style={{flex:1,textAlign:"right"}}>
                          <div style={{display:"flex",alignItems:"center",justifyContent:"flex-end",gap:6,cursor:"pointer"}} onClick={()=>homeJp&&goCountry(homeJp)}>
                            <span style={{color:"#fff",fontSize:13,fontWeight:600}}>{homeJp||"?"}</span>
                            {homeJp&&<FlagImg country={homeJp} size={22}/>}
                          </div>
                          {isDone&&<div style={{color:G.gold,fontWeight:900,fontSize:20,textAlign:"center"}}>{home?.score}</div>}
                        </div>
                        <div style={{textAlign:"center",minWidth:50}}>
                          {isLive ? <div style={{background:"#c00",color:"#fff",borderRadius:6,padding:"3px 8px",fontSize:11,fontWeight:700}}>LIVE</div>
                            : isDone ? <div style={{color:G.muted,fontSize:12}}>終了</div>
                            : <div style={{color:G.muted,fontSize:12}}>{time}</div>}
                        </div>
                        <div style={{flex:1,textAlign:"left"}}>
                          <div style={{display:"flex",alignItems:"center",justifyContent:"flex-start",gap:6,cursor:"pointer"}} onClick={()=>awayJp&&goCountry(awayJp)}>
                            {awayJp&&<FlagImg country={awayJp} size={22}/>}
                            <span style={{color:"#fff",fontSize:13,fontWeight:600}}>{awayJp||"?"}</span>
                          </div>
                          {isDone&&<div style={{color:G.gold,fontWeight:900,fontSize:20}}>{away?.score}</div>}
                        </div>
                      </div>
                      {m.name&&<div style={{color:"#445",fontSize:10,textAlign:"center",marginTop:6}}>{m.name}</div>}
                    </div>
                  );
                })}
              </div>
            ))
        }
      </div>
    </div>
  );
}

/* ── 国別詳細 ── */
function PgCountry({nav, country}) {
  const [matches, setMatches] = useState([]);
  const [loading, setLoading] = useState(true);
  const ai = AI_DATA.find(d=>d.country===country);

  useEffect(() => {
    if (!country) return;
    setLoading(true);
    fetchMatchRange().then(data => {
      const name = Object.entries(ESPN_TO_JP).find(([,jp])=>jp===country)?.[0];
      const filtered = name
        ? data.filter(m=>m.competitions?.[0]?.competitors?.some(c=>c.team?.displayName===name))
        : [];
      setMatches(filtered);
      setLoading(false);
    });
  }, [country]);

  if (!country) return null;

  return (
    <div style={{paddingBottom:40}}>
      <div style={{background:"linear-gradient(180deg,#0e3020,#08180e)",padding:"36px 20px 26px",textAlign:"center"}}>
        <Back onClick={()=>nav("ai")}/>
        <div style={{fontSize:52,marginBottom:8}}><FlagImg country={country} size={52}/></div>
        <div style={{color:G.gold,fontSize:22,fontWeight:900}}>{country}</div>
        {ai&&(
          <div style={{marginTop:10}}>
            <div style={{color:G.gold,fontWeight:900,fontSize:28}}>{ai.pct}%</div>
            <div style={{color:G.muted,fontSize:12}}>優勝候補スコア {ai.trend}</div>
            <div style={{color:"#8ba",fontSize:12,marginTop:8,lineHeight:1.6,padding:"0 20px"}}>{ai.reason}</div>
          </div>
        )}
      </div>
      <div style={{padding:"14px 18px 0"}}>
        <div style={{color:G.gold,fontWeight:700,fontSize:14,marginBottom:12}}>📅 試合情報</div>
        {loading ? <div style={{color:G.muted,textAlign:"center",padding:"30px 0"}}>取得中...</div>
          : matches.length === 0
            ? <div style={{...crd,textAlign:"center"}}><div style={{fontSize:32,marginBottom:10}}>📅</div><div style={{color:"#fff",fontWeight:700,marginBottom:6}}>試合データなし</div><div style={{color:G.muted,fontSize:13,lineHeight:1.8}}>開幕（6月11日）後に<br/>試合データが表示されます</div></div>
            : matches.map(m=>{
              const comps = m.competitions?.[0]?.competitors || [];
              const home = comps.find(c=>c.homeAway==="home")||comps[0];
              const away = comps.find(c=>c.homeAway==="away")||comps[1];
              const homeJp = ESPN_TO_JP[home?.team?.displayName]||home?.team?.displayName;
              const awayJp = ESPN_TO_JP[away?.team?.displayName]||away?.team?.displayName;
              const isDone = m.status?.type?.state === "post";
              const isLive = m.status?.type?.state === "in";
              const date = new Date(m.date).toLocaleDateString("ja-JP",{month:"numeric",day:"numeric"});
              const time = new Date(m.date).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
              return(
                <div key={m.id} style={{...crd,marginBottom:8}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                    <div style={{color:G.muted,fontSize:12}}>{date} {time}</div>
                    {isLive&&<div style={{background:"#c00",color:"#fff",borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700}}>LIVE</div>}
                    {isDone&&<div style={{color:G.muted,fontSize:12}}>終了</div>}
                  </div>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                    <div style={{textAlign:"center",flex:1}}>
                      <FlagImg country={homeJp} size={28}/>
                      <div style={{color:"#fff",fontSize:12,marginTop:4,fontWeight:600}}>{homeJp}</div>
                    </div>
                    <div style={{textAlign:"center",minWidth:60}}>
                      {isDone
                        ?<div style={{color:G.gold,fontWeight:900,fontSize:22}}>{home?.score} - {away?.score}</div>
                        :<div style={{color:G.muted,fontSize:14}}>vs</div>}
                    </div>
                    <div style={{textAlign:"center",flex:1}}>
                      <FlagImg country={awayJp} size={28}/>
                      <div style={{color:"#fff",fontSize:12,marginTop:4,fontWeight:600}}>{awayJp}</div>
                    </div>
                  </div>
                </div>
              );
            })
        }
        <div style={{marginTop:12}}><button style={btnO} onClick={()=>nav("ai")}>← 優勝候補リストに戻る</button></div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
